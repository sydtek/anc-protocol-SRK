<body>

<div class="container">

<h1>🩺 ANC Protocol Assistant by SRK</h1>

<label>Enter LMP (Last Menstrual Period)</label>

<input type="date" id="lmp">

<button onclick="calculateANC()">🔍 Generate ANC Protocol</button>

<div id="output"></div>

</div>

<script>

function calculateANC(){

let lmpInput=document.getElementById("lmp").value;

if(!lmpInput){
alert("Please enter LMP");
return;
}

let lmp=new Date(lmpInput);

let today=new Date();

let edd=new Date(lmp);
edd.setDate(edd.getDate()+280);

let diffTime=today-lmp;

let diffDays=Math.floor(diffTime/(1000*60*60*24));

let weeks=Math.floor(diffDays/7);

let days=diffDays%7;

let gestation=weeks+" weeks "+days+" days";

let visitStage="";

if(weeks<=12){
visitStage="1st Trimester (0–12 weeks)";
}

else if(weeks<=20){
visitStage="2nd Trimester Visit 1 (14–20 weeks)";
}

else if(weeks<=28){
visitStage="2nd Trimester Visit 2 (21–28 weeks)";
}

else if(weeks<=34){
visitStage="3rd Trimester Visit 1 (28–34 weeks)";
}

else if(weeks<=36){
visitStage="3rd Trimester Visit 2 (32–36 weeks)";
}

else{
visitStage="Term Pregnancy (37–40 weeks)";
}

document.getElementById("output").innerHTML=

`
<div class="resultbox">

<h2>Pregnancy Details</h2>

<p><b>LMP:</b> ${lmp.toDateString()}</p>

<p><b>EDD:</b> ${edd.toDateString()}</p>

<p><b>Gestational Age:</b> ${gestation}</p>

<p><b>Current ANC Stage:</b> ${visitStage}</p>
<div style="background:#ddd; border-radius:10px; overflow:hidden; margin:10px 0;">
  <div style="width:${Math.min(weeks/40*100,100)}%; background:#2c7be5; height:12px; transition: width 0.5s;"></div>
</div>
<div id="alerts">

</div>

<div id="protocolArea"></div>

`;
let alerts="";

if(weeks>=11 && weeks<=13){
alerts+="⚠ NT Scan window (11–13+6 weeks)<br>";
}

if(weeks>=18 && weeks<=22){
alerts+="⚠ Anomaly Scan due (18–22 weeks)<br>";
}

if(weeks>=24 && weeks<=28){
alerts+="⚠ GDM screening recommended<br>";
}

if(weeks>=28 && weeks<=32){
alerts+="⚠ Growth scan recommended<br>";
}

if(weeks>=36){
alerts+="⚠ Delivery planning and weekly follow-up required<br>";
}

if(alerts!=""){
document.getElementById("alerts").innerHTML=
`<div class="alert">🚨 ANC Alerts<br>${alerts}</div>`;
}
showProtocol(weeks);

}

</tr>

</div>
